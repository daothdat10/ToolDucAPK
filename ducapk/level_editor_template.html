<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Editor</title>
<style>
:root{
  --bg:#0B1020;--side:#0E1428;--panel:#141B33;--surface:#1C2542;--border:#2A3558;
  --text:#E6EAF5;--muted:#8D98B8;--sel:#26314F;--accent:#F472B6;--accent-2:#F9A8D4;
  --green:#34D399;--sky:#38BDF8;--amber:#FBBF24;--rose:#F87171;--violet:#A78BFA;
  --ink:#0B1020;--cell-empty:#0F1529;
  --mono:Consolas,"Cascadia Mono",ui-monospace,monospace;--sans:"Segoe UI",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#F5F6FA;--side:#ECEEF5;--panel:#FFFFFF;--surface:#EEF0F7;--border:#D5D9E6;
  --text:#161B2E;--muted:#5C6685;--sel:#E3E7F5;--accent:#DB2777;--accent-2:#BE185D;
  --green:#059669;--sky:#0284C7;--amber:#B45309;--rose:#DC2626;--violet:#7C3AED;
  --ink:#FFFFFF;--cell-empty:#F0F2F8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
button.ghost{background:transparent}
button.danger:hover{border-color:var(--rose);color:var(--rose)}
button.small{padding:2px 7px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:4px 7px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{font-family:var(--mono);font-size:12px;width:100%;resize:vertical}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--side);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{background:var(--accent);color:var(--ink);font-weight:800;width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.brand h1{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
main{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr) 380px;min-height:0}
aside,section{min-height:0;display:flex;flex-direction:column}
.pane-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600}
.pane-head .count{margin-left:auto;color:var(--muted);font:11px var(--mono)}
#levels{border-right:1px solid var(--border);background:var(--panel)}
#levelList{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
#levelList li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
#levelList li:hover{background:var(--surface)}
#levelList li.active{background:var(--sel);border-color:var(--accent)}
#levelList li.drag-over{border-top:2px solid var(--accent)}
#levelList .num{font:600 11px var(--mono);color:var(--accent);min-width:28px}
#levelList .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#levelList .warn{color:var(--amber);font-size:11px}
.level-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:8px;border-top:1px solid var(--border)}
#editorPane{overflow:auto;padding:14px 18px 60px}
#rightPane{border-left:1px solid var(--border);background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 4px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-body{flex:1;overflow:auto;padding:12px;display:none}
.tab-body.on{display:block}
pre{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.field{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:4px 12px;align-items:start;padding:5px 0;border-bottom:1px dashed color-mix(in srgb,var(--border) 60%,transparent)}
.field>label{padding-top:4px;overflow:hidden;text-overflow:ellipsis}
.field>label .fname{font-weight:600}
.field>label .ftype{display:block;color:var(--muted);font:11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field>label .tip{display:block;color:var(--muted);font-size:11px;white-space:normal}
.field.wide{grid-template-columns:1fr}
.badge{display:inline-block;font:600 10px var(--mono);padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:1px;background:var(--surface);color:var(--muted)}
.badge.apk{color:var(--sky)}.badge.prop{color:var(--violet)}.badge.unity{color:var(--green)}
.group-header{margin:14px 0 2px;color:var(--accent);font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em}
details.obj{border:1px solid var(--border);border-radius:7px;background:var(--panel);margin:2px 0}
details.obj>summary{cursor:pointer;padding:6px 10px;list-style:none;display:flex;gap:8px;align-items:center}
details.obj>summary::-webkit-details-marker{display:none}
details.obj>summary::before{content:"▸";color:var(--muted)}
details.obj[open]>summary::before{content:"▾"}
details.obj>.obj-body{padding:2px 12px 8px}
.summary-text{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.list{display:flex;flex-direction:column;gap:4px}
.list-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.list-head .count{color:var(--muted);font:11px var(--mono)}
.list-item{display:flex;gap:6px;align-items:flex-start}
.list-item>.idx{font:11px var(--mono);color:var(--muted);min-width:26px;padding-top:6px;text-align:right}
.list-item>.val{flex:1;min-width:0}
.list-item>.ops{display:flex;gap:2px;padding-top:2px}
.inline-list{display:flex;flex-wrap:wrap;gap:4px}
.inline-list .chip{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:5px;padding:1px 2px 1px 4px}
.inline-list .chip input,.inline-list .chip select{width:74px;padding:2px 4px}
.inline-list .chip button{padding:0 5px;border:0;background:transparent;color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flags label{background:var(--surface);border-radius:5px;padding:2px 7px;cursor:pointer}
.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{width:40px;height:26px;padding:0;border:1px solid var(--border);border-radius:5px;background:none}
.board{margin:6px 0 10px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.board-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.board-head strong{color:var(--accent)}
.palette{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.swatch{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 4px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-size:12px;background:var(--bg)}
.swatch i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25)}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grid-wrap{overflow:auto;max-height:560px}
.grid{display:grid;gap:2px;user-select:none;width:max-content}
.cell{width:var(--cs,34px);height:var(--cs,34px);border-radius:4px;background:var(--cell-empty);display:grid;place-items:center;font:600 10px var(--mono);color:#0B1020;cursor:crosshair;position:relative;overflow:hidden;border:1px solid transparent}
.cell.empty{color:var(--muted)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell .stack{position:absolute;right:1px;bottom:0;font-size:9px;color:#fff;text-shadow:0 0 2px #000}
.axis{font:10px var(--mono);color:var(--muted);display:grid;place-items:center}
.hint{color:var(--muted);font-size:12px}
.warnbox{border:1px solid var(--amber);color:var(--amber);border-radius:6px;padding:6px 10px;margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.issue{padding:6px 8px;border-left:3px solid var(--amber);background:var(--bg);margin-bottom:5px;border-radius:0 5px 5px 0}
.issue.err{border-color:var(--rose)}
.issue code,.mono{font-family:var(--mono);font-size:12px}
.ok{color:var(--green)}
.card{border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.card h4{margin:0 0 4px;font-size:13px;display:flex;gap:6px;align-items:center}
.card .ns{color:var(--muted);font:11px var(--mono)}
.members{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.members span{font:11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--surface)}
.members span i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.sample{display:flex;gap:6px;align-items:center;padding:5px 6px;border-radius:5px}
.sample:hover{background:var(--surface)}
.sample .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sample .score{font:11px var(--mono);color:var(--muted);min-width:40px;text-align:right}
.toolbar-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90vw}
footer{display:flex;gap:14px;padding:5px 16px;border-top:1px solid var(--border);background:var(--side);color:var(--muted);font:11px var(--mono);flex-wrap:wrap}
.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;max-width:min(900px,92vw);width:100%;padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .dlg-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
dialog .dlg-body{padding:12px 14px;max-height:70vh;overflow:auto}
@media (max-width:1100px){main{grid-template-columns:200px minmax(0,1fr)}#rightPane{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);max-height:45vh}}
@media (max-width:700px){main{grid-template-columns:1fr}#levels{max-height:30vh;border-right:0;border-bottom:1px solid var(--border)}.field{grid-template-columns:1fr}#editorPane{padding:12px 16px 40px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">L</div><div style="min-width:0"><h1 id="title">Level Editor</h1><div class="sub" id="subtitle"></div></div></div>
  <div class="tools">
    <button id="btnUndo" title="Ctrl+Z">↶ Hoàn tác</button>
    <button id="btnRedo" title="Ctrl+Y">↷ Làm lại</button>
    <label class="hint" title="Cách ghi enum trong JSON">Enum:
      <select id="enumMode"><option value="number">số</option><option value="name">tên</option></select></label>
    <button id="btnImport">Nhập JSON…</button>
    <button id="btnExportOne">Tải level</button>
    <button id="btnExportZip" class="primary">Tải tất cả (.zip)</button>
    <button id="btnExportArray" title="Một file JSON chứa mảng levels">Tải gộp</button>
    <button id="btnTheme" class="ghost" title="Đổi giao diện sáng/tối">◐</button>
  </div>
</header>
<main>
  <aside id="levels">
    <div class="pane-head">Danh sách level<span class="count" id="levelCount"></span></div>
    <ul id="levelList"></ul>
    <div class="level-actions">
      <button id="btnNew">＋ Mới</button><button id="btnDup">⧉ Nhân bản</button><button id="btnDel" class="danger">✕ Xóa</button>
      <button id="btnUp">↑ Lên</button><button id="btnDown">↓ Xuống</button><button id="btnRenumber" title="Gán lại trường số thứ tự theo vị trí">№ Đánh số</button>
    </div>
  </aside>
  <section id="editorPane"></section>
  <aside id="rightPane">
    <div class="tabs">
      <button data-tab="json" class="on">JSON</button><button data-tab="mech">Cơ chế game</button>
      <button data-tab="samples">Level từ APK</button><button data-tab="check">Kiểm tra</button>
    </div>
    <div class="tab-body on" id="tab-json">
      <div class="toolbar-row"><button id="btnCopy" class="small">Sao chép</button><span class="hint">JSON của level đang chọn, đúng schema LevelData.</span></div>
      <pre id="jsonOut"></pre>
    </div>
    <div class="tab-body" id="tab-mech"></div>
    <div class="tab-body" id="tab-samples">
      <div class="toolbar-row"><input type="text" id="sampleFilter" placeholder="Lọc theo tên/nhóm…" style="flex:1"><button id="btnImportAllSamples" class="small">Nhập tất cả đã lọc</button></div>
      <div id="sampleList"></div>
    </div>
    <div class="tab-body" id="tab-check"></div>
  </aside>
</main>
<footer><span id="stat"></span><span id="saveState"></span><span style="margin-left:auto">DucAPK · Level Editor</span></footer>
<input type="file" id="fileInput" accept=".json,application/json" multiple hidden>
<dialog id="dlg"><div class="dlg-head"><strong id="dlgTitle"></strong><span style="margin-left:auto"></span><button id="dlgAction" class="primary small"></button><button id="dlgClose" class="small">Đóng</button></div><div class="dlg-body"><pre id="dlgBody"></pre></div></dialog>
<div id="toast"></div>
<script>
"use strict";
const D = /*__DUCAPK_DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
};
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const KEY = "ducapk-level-editor:" + D.meta.schema_id;
const ROOT = D.root;
const S = { levels: [], cur: 0, enumMode: "number", open: new Set(), undo: [], redo: [], last: "", sel: null, pal: {} };

/* ---------- schema helpers ---------- */
const cls = key => D.classes[key] || { name: key, fields: [] };
const enm = key => D.enums[key] || { name: key, members: [] };
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const memberName = (desc, v) => { const m = enm(desc.ref).members.find(x => x[0] === v); return m ? m[1] : null; };
function enumLabel(desc, v) {
  const e = enm(desc.ref);
  if (e.flags && v) { const names = e.members.filter(m => m[0] && (v & m[0]) === m[0]).map(m => m[1]); if (names.length) return names.join("|"); }
  return memberName(desc, v) ?? String(v);
}
function typeLabel(desc) {
  switch (desc.k) {
    case "list": return (desc.md ? "[" + ",".repeat(desc.md - 1) + "] " : "List<") + typeLabel(desc.md ? innermost(desc) : desc.of) + (desc.md ? "" : ">");
    case "dict": return `Dict<${typeLabel(desc.key)}, ${typeLabel(desc.val)}>`;
    case "obj": return cls(desc.ref).name;
    case "enum": return enm(desc.ref).name;
    case "raw": return desc.cs || "?";
    default: return desc.k;
  }
}
const innermost = d => { while (d.k === "list") d = d.of; return d; };
const isScalar = d => ["int", "float", "bool", "string", "char", "enum"].includes(d.k);

function defaultFor(desc, depth = 0) {
  if (desc.nullable) return null;
  switch (desc.k) {
    case "int": case "float": return 0;
    case "bool": return false;
    case "string": case "char": return "";
    case "enum": { const m = enm(desc.ref).members; return m.length ? m[0][0] : 0; }
    case "list": return [];
    case "dict": return {};
    case "obj": return depth > 6 ? null : makeObj(desc.ref, depth + 1);
    default: return null;
  }
}
function makeObj(key, depth = 0) {
  const o = {};
  const fields = cls(key).fields;
  for (const f of fields) o[f.json] = f.default !== undefined ? clone(f.default) : defaultFor(f.type, depth);
  /* flat width×height maps start with one entry per cell */
  const w = fields.find(f => f.type.k === "int" && W_NAMES.test(norm(f.json))), h = fields.find(f => f.type.k === "int" && H_NAMES.test(norm(f.json)));
  const cells = w && h ? (o[w.json] | 0) * (o[h.json] | 0) : 0;
  if (cells > 0 && cells <= 10000) for (const f of fields) if (isFlatGrid(f.type, w, h) && Array.isArray(o[f.json]) && !o[f.json].length)
    for (let i = 0; i < cells; i++) o[f.json].push(defaultFor(f.type.of, depth));
  return o;
}
const isFlatGrid = desc => desc.k === "list" && (isScalar(desc.of) || (desc.of.k === "obj" && cls(desc.of.ref).src !== "unity" && !coordFields(desc.of.ref) && typeField(desc.of.ref)));

/* coerce any JSON (APK data, imported files) into the LevelData shape */
function coerce(desc, v, stats, depth = 0) {
  if (v === null || v === undefined) return desc.nullable ? null : defaultFor(desc, depth);
  switch (desc.k) {
    case "int": { const n = typeof v === "boolean" ? +v : Number(v); return Number.isFinite(n) ? Math.trunc(n) : (stats.bad++, 0); }
    case "float": { const n = Number(v); return Number.isFinite(n) ? n : (stats.bad++, 0); }
    case "bool": return v === true || v === 1 || v === "true" || v === "1";
    case "string": case "char": return typeof v === "string" ? v : typeof v === "object" ? JSON.stringify(v) : String(v);
    case "enum": {
      if (typeof v === "number") return Math.trunc(v);
      if (typeof v === "string") {
        const e = enm(desc.ref); let total = 0, hit = false;
        for (const part of v.split(/[|,]/)) {
          const m = e.members.find(x => norm(x[1]) === norm(part));
          if (m) { total |= m[0]; hit = true; } else if (/^-?\d+$/.test(part.trim())) { total |= +part; hit = true; }
        }
        if (hit) return total;
      }
      stats.bad++; return defaultFor(desc);
    }
    case "list": {
      if (!Array.isArray(v)) { if (v && typeof v === "object" && Array.isArray(v.Array || v.items || v.list)) v = v.Array || v.items || v.list; else { stats.bad++; return []; } }
      return v.map(x => coerce(desc.of, x, stats, depth + 1));
    }
    case "dict": {
      if (Array.isArray(v)) { const o = {}; for (const p of v) if (p && typeof p === "object") o[p.Key ?? p.key ?? p.k] = coerce(desc.val, p.Value ?? p.value ?? p.v, stats, depth + 1); return o; }
      if (typeof v !== "object") { stats.bad++; return {}; }
      const o = {}; for (const [k, x] of Object.entries(v)) o[k] = coerce(desc.val, x, stats, depth + 1); return o;
    }
    case "obj": {
      if (typeof v !== "object" || Array.isArray(v)) { stats.bad++; return defaultFor(desc, depth); }
      const c = cls(desc.ref), o = {}, used = new Set(), keys = Object.keys(v);
      for (const f of c.fields) {
        const want = [f.json, f.name].map(norm);
        let k = keys.find(x => x === f.json) ?? keys.find(x => want.includes(norm(x))) ?? keys.find(x => want.includes(norm(x.replace(/^m_|^_/, ""))));
        if (k === undefined) { stats.missing++; o[f.json] = f.default !== undefined ? clone(f.default) : defaultFor(f.type, depth); }
        else { used.add(k); stats.matched++; o[f.json] = coerce(f.type, v[k], stats, depth + 1); }
      }
      stats.ignored += keys.filter(k => !used.has(k)).length;
      return o;
    }
    default: return clone(v);
  }
}
/* how well an object fits a class: fraction of field names present */
function fit(key, obj) {
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return 0;
  const fields = cls(key).fields; if (!fields.length) return 0;
  const keys = new Set(Object.keys(obj).map(k => norm(k.replace(/^m_|^_/, ""))));
  return fields.filter(f => keys.has(norm(f.json)) || keys.has(norm(f.name))).length / fields.length;
}
/* find the sub-object of any decoded APK record that best fits the root class */
function bestMatch(data) {
  let best = { score: fit(ROOT, data), value: data, path: "" };
  const walk = (v, path, depth) => {
    if (depth > 4 || !v || typeof v !== "object") return;
    for (const [k, x] of Object.entries(v)) {
      if (Array.isArray(x)) { if (x.length && typeof x[0] === "object") walk(x[0], path + "." + k + "[0]", depth + 1); continue; }
      if (x && typeof x === "object") { const s = fit(ROOT, x); if (s > best.score) best = { score: s, value: x, path: path + "." + k }; walk(x, path + "." + k, depth + 1); }
    }
  };
  walk(data, "", 0);

    .forEach(([o, v, s]) => s === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true));
  return new Blob([...parts, ...central, e.buffer], { type: "application/zip" });
}
function exportGuard() {
  const bad = S.levels.map((l, i) => [i, validate(l).filter(x => x.err).length]).filter(x => x[1]);
  return !bad.length || confirm(`${bad.length} level còn lỗi (vd. Level ${bad[0][0] + 1}). Vẫn xuất?`);
}

/* ---------- misc ---------- */
let toastTimer = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, 5200); }
function setTheme(t) { document.documentElement.dataset.theme = t; store.set("ducapk-level-editor:theme", t); }

function boot() {
  document.title = `${D.meta.title} · Level Editor`;
  $("#title").textContent = `${D.meta.title} — Level Editor`;
  $("#subtitle").textContent = [D.meta.apk && "APK: " + D.meta.apk, "LevelData: " + D.meta.leveldata.map(p => p.split(/[\\/]/).pop()).join(", "), "tạo " + D.meta.generated.replace("T", " ")].filter(Boolean).join("  ·  ");
  const theme = store.get("ducapk-level-editor:theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  setTheme(theme);
  if (Object.values(D.enums).some(e => e.string)) S.enumMode = "name";
  const saved = store.get(KEY);
  if (saved) { try { const d = JSON.parse(saved); if (Array.isArray(d.levels) && d.levels.length) { S.levels = d.levels; S.cur = d.cur | 0; S.enumMode = d.enumMode || S.enumMode; setTimeout(() => toast("Đã khôi phục bản nháp từ lần trước."), 300); } } catch (e) {} }
  if (!S.levels.length) S.levels.push(makeObj(ROOT));
  $("#enumMode").value = S.enumMode;
  S.last = snapshot();

  $("#enumMode").onchange = e => { S.enumMode = e.target.value; changed(false); };
  $("#btnTheme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
  $("#btnUndo").onclick = undo; $("#btnRedo").onclick = redo;
  $("#btnNew").onclick = () => { S.levels.splice(S.cur + 1, 0, makeObj(ROOT)); S.cur++; changed(true); };
  $("#btnDup").onclick = () => { S.levels.splice(S.cur + 1, 0, clone(S.levels[S.cur])); S.cur++; changed(true); };
  $("#btnDel").onclick = () => { if (!confirm(`Xóa Level ${S.cur + 1}?`)) return; S.levels.splice(S.cur, 1); if (!S.levels.length) S.levels.push(makeObj(ROOT)); changed(true); };
  $("#btnUp").onclick = () => move(S.cur, S.cur - 1);
  $("#btnDown").onclick = () => move(S.cur, S.cur + 1);
  $("#btnRenumber").onclick = () => {
    const f = idField(); if (!f) return;
    const start = prompt(`Gán ${f.json} theo thứ tự, bắt đầu từ:`, "1"); if (start === null || !/^-?\d+$/.test(start.trim())) return;
    S.levels.forEach((lv, i) => { lv[f.json] = +start + i; }); changed(true);
  };
  $("#btnImport").onclick = () => $("#fileInput").click();
  $("#fileInput").onchange = e => { importFiles([...e.target.files]); e.target.value = ""; };
  $("#btnExportOne").onclick = () => { if (exportGuard()) download(fileName(S.cur), JSON.stringify(levelJSON(S.levels[S.cur]), null, 2)); };
  $("#btnExportZip").onclick = () => { if (exportGuard()) download(`${D.meta.title}_levels.zip`, zip(S.levels.map((l, i) => ({ name: fileName(i), text: JSON.stringify(levelJSON(l), null, 2) })))); };
  $("#btnExportArray").onclick = () => { if (exportGuard()) download(`${D.meta.title}_levels.json`, JSON.stringify(S.levels.map(levelJSON), null, 2)); };
  $("#btnCopy").onclick = async () => { try { await navigator.clipboard.writeText($("#jsonOut").textContent); toast("Đã sao chép JSON."); } catch (e) { toast("Trình duyệt chặn clipboard; hãy bôi đen và sao chép."); } };
  $("#dlgClose").onclick = () => $("#dlg").close();
  $("#sampleFilter").oninput = renderSamples;
  $("#btnImportAllSamples").onclick = () => {
    const list = filteredSamples(); if (!list.length || !confirm(`Nhập ${list.length} level từ APK vào cuối danh sách?`)) return;
    const pristine = S.levels.length === 1 && isPristine(S.levels[0]);
    const total = { matched: 0, missing: 0, ignored: 0, bad: 0 };
    for (const [, i] of list) { const s = importSample(i, true); for (const k in total) total[k] += s[k]; }
    if (pristine) { S.levels.shift(); S.cur = Math.max(0, S.cur - 1); }
    changed(true); toast(`Đã nhập ${list.length} level: khớp ${total.matched} trường, thiếu ${total.missing}, bỏ ${total.ignored} khóa lạ.`);
  };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tab-body").forEach(x => x.classList.toggle("on", x.id === "tab-" + b.dataset.tab));
  });
  document.addEventListener("keydown", e => {
    if (!(e.ctrlKey || e.metaKey) || ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) && document.activeElement.type !== "checkbox") return;
    if (e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
  });
  document.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); document.body.classList.add("dropping"); } });
  document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
  document.addEventListener("drop", e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); document.body.classList.remove("dropping"); importFiles([...e.dataTransfer.files].filter(f => /\.json$/i.test(f.name))); });
  renderMechanics(); renderSamples(); renderAll(); updateUndo();
}
boot();
</script>
</body>
</html>
